<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 340 340" width="100%" height="100%">
  <defs>
    <!-- Circular Path for Top Text -->
    <path id="top-arc" d="M 30,170 A 140,140 0 1,1 310,170" fill="none" />
    <!-- Circular Path for Bottom Text -->
    <path id="bottom-arc" d="M 310,170 A 140,140 0 0,1 30,170" fill="none" />
    
    <!-- Circle Clip for Center Photo -->
    <clipPath id="circle-clip">
      <circle cx="170" cy="170" r="82" />
    </clipPath>
  </defs>

  <g stroke="#15803d">
    <!-- Outer Heavy Seal Ring -->
    <circle cx="170" cy="170" r="158" fill="none" stroke-width="5" />

    <!-- Inner Fine Seal Ring -->
    <circle cx="170" cy="170" r="114" fill="none" stroke-width="2" />

    <!-- Top Text: ★ THE BOEHM CLASSROOM ★ -->
    <text font-family="'Arial Black', 'Impact', sans-serif" font-size="16" font-weight="900" letter-spacing="2.2">
      <textPath href="#top-arc" xlink:href="#top-arc" startOffset="50%" text-anchor="middle" fill="#15803d" stroke="none">
        ★ THE BOEHM CLASSROOM ★
      </textPath>
    </text>

    <!-- Bottom Text: CHISHOLM HIGH SCHOOL -->
    <text font-family="'Arial Black', 'Impact', sans-serif" font-size="14.5" font-weight="900" letter-spacing="3">
      <textPath href="#bottom-arc" xlink:href="#bottom-arc" startOffset="50%" text-anchor="middle" fill="#15803d" stroke="none">
        CHISHOLM HIGH SCHOOL
      </textPath>
    </text>

    <!-- Dotted Inner Border Ring -->
    <circle cx="170" cy="170" r="84" fill="none" stroke-width="2" stroke-dasharray="4,3" />

    <!-- CENTER PHOTO (Cropped into Circle) -->
    <image href="boehm_photo.jpg" xlink:href="boehm_photo.jpg" x="88" y="88" width="164" height="164" preserveAspectRatio="xMidYMid slice" clip-path="url(#circle-clip)" />
  </g>
</svg>
